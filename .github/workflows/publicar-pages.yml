name: Publicar Mastria AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: paginas
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v6
      - name: Preparar publicação
        uses: actions/configure-pages@v5
      - name: Enviar arquivos do aplicativo
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Publicar aplicativo
        id: publicacao
        uses: actions/deploy-pages@v4
